# Database - override with environment variables in AWS (e.g. an RDS endpoint).
# Defaults keep the original local setup working.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reservation}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test1234}

# Schema is managed by flightdb.sql, never by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Elastic Beanstalk passes PORT; default stays 8080.
server.port=${PORT:8080}
server.servlet.context-path=/flightservices
server.error.include-message=always

# Health check for load balancers: GET /flightservices/actuator/health
management.endpoints.web.exposure.include=health,info
